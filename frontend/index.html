<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CalorieCAM: Instant visual meal recognition, plate focus highlights, and nutrition macro tracking." />
    <meta name="theme-color" content="#E7E6E4" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <title>CalorieCAM</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('meal-triage-theme');
          if (stored === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
