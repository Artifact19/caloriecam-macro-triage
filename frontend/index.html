<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CalorieCAM: local visual meal recognition, Grad-CAM explainability, and macro triage." />
    <meta name="theme-color" content="#FCEFE6" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='26' height='26' rx='7' fill='%23F25F5C' stroke='%23141414' stroke-width='3'/%3E%3C/svg%3E"
    />
    <title>CalorieCAM</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('meal-triage-theme');
          if (stored === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
